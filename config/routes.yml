# Routes BO de snt_quotes. Toutes rattachées à l'onglet AdminSntQuotes (droits natifs + jeton d'URL admin).
# Les droits fins sont vérifiés dans les contrôleurs (compatibles PS 8.2 et 9.x).

admin_snt_quotes_index:
  path: /sntquotes
  methods: [GET]
  defaults:
    _controller: 'Snt\Quotes\Controller\Admin\QuoteController::indexAction'
    _legacy_controller: AdminSntQuotes
    _legacy_link: AdminSntQuotes

admin_snt_quotes_search:
  path: /sntquotes
  methods: [POST]
  defaults:
    _controller: 'Snt\Quotes\Controller\Admin\QuoteController::searchAction'
    _legacy_controller: AdminSntQuotes
    _legacy_link: 'AdminSntQuotes:submitFiltersnt_quote'

admin_snt_quotes_create:
  path: /sntquotes/new
  methods: [GET]
  defaults:
    _controller: 'Snt\Quotes\Controller\Admin\QuoteController::createAction'
    _legacy_controller: AdminSntQuotes

admin_snt_quotes_view:
  path: /sntquotes/{quoteId}
  methods: [GET]
  defaults:
    _controller: 'Snt\Quotes\Controller\Admin\QuoteController::viewAction'
    _legacy_controller: AdminSntQuotes
  requirements:
    quoteId: '\d+'

admin_snt_quotes_edit:
  path: /sntquotes/{quoteId}/edit
  methods: [GET]
  defaults:
    _controller: 'Snt\Quotes\Controller\Admin\QuoteController::editAction'
    _legacy_controller: AdminSntQuotes
  requirements:
    quoteId: '\d+'

admin_snt_quotes_pdf:
  path: /sntquotes/{quoteId}/pdf
  methods: [GET]
  defaults:
    _controller: 'Snt\Quotes\Controller\Admin\QuoteController::pdfAction'
    _legacy_controller: AdminSntQuotes
  requirements:
    quoteId: '\d+'

admin_snt_quotes_send_preview:
  path: /sntquotes/{quoteId}/send/preview
  methods: [POST]
  defaults:
    _controller: 'Snt\Quotes\Controller\Admin\QuoteController::sendPreviewAction'
    _legacy_controller: AdminSntQuotes
  requirements:
    quoteId: '\d+'

admin_snt_quotes_send:
  path: /sntquotes/{quoteId}/send
  methods: [POST]
  defaults:
    _controller: 'Snt\Quotes\Controller\Admin\QuoteController::sendAction'
    _legacy_controller: AdminSntQuotes
  requirements:
    quoteId: '\d+'

admin_snt_quotes_remind:
  path: /sntquotes/{quoteId}/remind
  methods: [POST]
  defaults:
    _controller: 'Snt\Quotes\Controller\Admin\QuoteController::remindAction'
    _legacy_controller: AdminSntQuotes
  requirements:
    quoteId: '\d+'

admin_snt_quotes_transition:
  path: /sntquotes/{quoteId}/status/{to}
  methods: [POST]
  defaults:
    _controller: 'Snt\Quotes\Controller\Admin\QuoteController::transitionAction'
    _legacy_controller: AdminSntQuotes
  requirements:
    quoteId: '\d+'
    to: '[a-z_]+'

admin_snt_quotes_duplicate:
  path: /sntquotes/{quoteId}/duplicate
  methods: [POST]
  defaults:
    _controller: 'Snt\Quotes\Controller\Admin\QuoteController::duplicateAction'
    _legacy_controller: AdminSntQuotes
  requirements:
    quoteId: '\d+'

admin_snt_quotes_new_version:
  path: /sntquotes/{quoteId}/version
  methods: [POST]
  defaults:
    _controller: 'Snt\Quotes\Controller\Admin\QuoteController::newVersionAction'
    _legacy_controller: AdminSntQuotes
  requirements:
    quoteId: '\d+'

admin_snt_quotes_delete:
  path: /sntquotes/{quoteId}/delete
  methods: [POST]
  defaults:
    _controller: 'Snt\Quotes\Controller\Admin\QuoteController::deleteAction'
    _legacy_controller: AdminSntQuotes
  requirements:
    quoteId: '\d+'

admin_snt_quotes_bulk_expire:
  path: /sntquotes/bulk/expire
  methods: [POST]
  defaults:
    _controller: 'Snt\Quotes\Controller\Admin\QuoteController::bulkExpireAction'
    _legacy_controller: AdminSntQuotes

admin_snt_quotes_bulk_remind:
  path: /sntquotes/bulk/remind
  methods: [POST]
  defaults:
    _controller: 'Snt\Quotes\Controller\Admin\QuoteController::bulkRemindAction'
    _legacy_controller: AdminSntQuotes

